
name: CharterGate GenLayer verification
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q contracts tests
      - run: python -m pytest tests/offline -q
      - run: python -m pytest tests/direct -q
      - run: genvm-lint check contracts/*.py
      - run: sha256sum contracts/*.py
